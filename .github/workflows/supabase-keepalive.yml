# Mantém o projeto Supabase (plano gratuito) ativo: projetos sem atividade por
# 7 dias são pausados e a sincronização entre computadores para de funcionar.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 11 */3 * *' # a cada 3 dias
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve na API do Supabase
        env:
          # Mesma URL/chave pública (anon) já embutidas no app; RLS impede acesso a dados
          SUPABASE_URL: https://pkmedbjdxvwafvofgnrj.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrbWVkYmpkeHZ3YWZ2b2ZnbnJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTM5NDcsImV4cCI6MjEwNDk4OTk0N30.KXB0RLjKH3TV6_WhUES1-rxpz5ZymSf2b2AnKYrZcjk
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondeu HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "::error::Projeto Supabase indisponível ou pausado (HTTP $status). Reative em supabase.com/dashboard."
            exit 1
          fi
